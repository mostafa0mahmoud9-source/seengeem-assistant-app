plugins { id 'com.android.application' }
def releaseVersion = providers.gradleProperty('releaseVersion').getOrElse('1.1.0')
def parts = releaseVersion.tokenize('.').collect { it.toInteger() }
def signingPath = System.getenv('ANDROID_KEYSTORE_PATH')
android {
 namespace 'com.seengeem.assistant'
 compileSdk 35
 defaultConfig { applicationId 'com.seengeem.assistant'; minSdk 26; targetSdk 35; versionCode parts[0]*1000000+parts[1]*1000+parts[2]; versionName releaseVersion }
 buildFeatures { buildConfig true }
 signingConfigs { release { if (signingPath) { storeFile file(signingPath); storePassword System.getenv('ANDROID_STORE_PASSWORD'); keyAlias System.getenv('ANDROID_KEY_ALIAS'); keyPassword System.getenv('ANDROID_KEY_PASSWORD') } } }
 buildTypes { release { if (signingPath) signingConfig signingConfigs.release; minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
